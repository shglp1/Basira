name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure npm registry
        run: |
          if [ -n "${NPM_REGISTRY_URL}" ]; then
            npm config set registry "${NPM_REGISTRY_URL}"
          fi
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
